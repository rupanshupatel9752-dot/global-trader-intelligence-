name: Build Android APK

concurrency:
  group: android-apk-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: global-trader-intelligence-debug-signing-v1
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK is a real packaged application
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APK_BYTES=$(stat -c%s "$APK")
          echo "APK size: $APK_BYTES bytes"
          if [ "$APK_BYTES" -lt 30000 ]; then
            echo "APK is unexpectedly small; refusing to publish an incomplete build."
            exit 1
          fi
          unzip -l "$APK" | grep -E 'classes.dex|AndroidManifest.xml' | head -n 10
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Global-Trader-Intelligence-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
